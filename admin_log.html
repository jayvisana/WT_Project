<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="fixed-top">
        <nav class="navbar py-2">
            <div class="d-flex justify-content-between container-fluid">
                <div class="d-flex align-items-center">
                    <a href="index.html">
                        <img src="images/j-logo.png" alt="Website Logo" style="height: 30px;">
                    </a>
                </div>
                <a class="navbar-brand fw-bold fs-5" href="index.html">Admin Panel</a>
                <div class="d-flex align-items-center">
                    <div class="d-flex align-items-xl-center">
                        <button onclick="toggle()">
                            Theme
                        </button>
                    </div>
                </div>
            </div>
        </nav>
        <nav class="navbar navbar-expand-lg py-0">
            <div class="container-lg container-fluid">
            </div>
        </nav>
    </header>

    <div class="form-container">
        <div class="form-card text-center">
            <h2 class="fw-bold">Admin Login</h2>
            <form id="adminLoginForm" class="needs-validation">
                <div class="mb-3 text-start">
                    <label for="adminLoginEmail" class="form-label text-primary">Email / User ID</label>
                    <input type="text" class="form-control" id="adminLoginEmail" value="admin@website.com"
                        placeholder="Enter Admin Email or User ID" required>
                    <div class="invalid-feedback">
                        Please enter a valid Email or User ID.
                    </div>
                </div>
                <div class="mb-3 text-start">
                    <label for="adminLoginPassword" class="form-label text-primary">Password</label>
                    <input type="password" class="form-control" id="adminLoginPassword" value="password123"
                        placeholder="Enter Admin Password" required>
                    <div class="invalid-feedback">
                        Password must be 8+ characters, including at least one letter and one number.
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="adminRememberMe">
                        <label class="form-check-label text-muted" for="adminRememberMe">
                            Remember Me
                        </label>
                    </div>
                    <a href="admin_reset_password.html" class="text-muted small">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
