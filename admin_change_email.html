<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Admin Email - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="fixed-top">
        <nav class="navbar py-2">
            <div class="d-flex justify-content-between container-fluid">
                <div class="d-flex align-items-center">
                    <a href="index.html">
                        <img src="images/j-logo.png" alt="Website Logo" style="height: 30px;">
                    </a>
                </div>
                <a class="navbar-brand fw-bold fs-5 " href="index.html">Website</a>
                <div class="d-flex align-items-center">
                    <div class="d-flex align-items-xl-center">
                        <button onclick="toggle()">
                            Theme
                        </button>
                    </div>
                </div>
            </div>
        </nav>
        <nav class="navbar navbar-expand-lg py-0">
            <div class="container-lg container-fluid">
                <button class="navbar-toggler border-0 p-2" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavLinks">
                    <ul class="navbar-nav w-100 justify-content-around mb-1 mb-lg-0">
                        <li class="nav-item">
                            <a href="admin_dashboard.html" class="nav-link py-3">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a href="admin_upload.html" class="nav-link py-3">Upload</a>
                        </li>
                        <li class="nav-item">
                            <a href="admin_manage_users.html" class="nav-link py-3">Users</a>
                        </li>
                        <li class="nav-item">
                            <a href="admin_manage_email.html" class="nav-link py-3">Inbox</a>
                        </li>
                        <li class="nav-item">
                            <a href="admin_change_email.html" class="nav-link py-3">Change Email</a>
                        </li>
                        <li class="nav-item">
                            <a href="admin_reset_password.html" class="nav-link py-3">Reset Password</a>
                        </li>
                        <li class="nav-item">
                            <a href="index.html" class="nav-link py-3">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="form-container">
        <div class="form-card text-center">
            <h2 class="fw-bold">Change Admin Email</h2>
            <form id="changeEmailForm" class="needs-validation">
                <div class="mb-3 text-start">
                    <label for="currentPasswordEmail" class="form-label text-primary">Current Password</label>
                    <input type="password" class="form-control" id="currentPasswordEmail"
                        placeholder="Enter Current Password" required>
                    <div class="invalid-feedback">Password must be 8+ characters, including one letter and one number.
                    </div>
                </div>
                <div class="mb-3 text-start">
                    <label for="newEmail" class="form-label text-primary">New Email</label>
                    <input type="text" class="form-control" id="newEmail" placeholder="Enter New Email" required>
                    <div class="invalid-feedback">Please enter a valid new email address.</div>
                </div>
                <div class="mb-4 text-start">
                    <label for="confirmNewEmail" class="form-label text-primary">Confirm New Email</label>
                    <input type="text" class="form-control" id="confirmNewEmail" placeholder="Re-enter New Email"
                        required>
                    <div class="invalid-feedback" id="confirmNewEmailFeedback">Emails do not match.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Update Email</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
